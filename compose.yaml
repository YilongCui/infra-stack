name: infra-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    profiles: ["database"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database_mysql_data:/var/lib/mysql
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  postgres:
    image: postgres:17.9
    container_name: postgres
    profiles: ["database"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - database_postgres_data:/var/lib/postgresql/data
      - ./database/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./database/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  mongo:
    image: mongo:8.0.20
    container_name: mongo
    profiles: ["database"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - database_mongo_data:/data/db
      - database_mongo_config:/data/configdb
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    profiles: ["cache"]
    ports:
      - "6379:6379"
    volumes:
      - database_redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4.2.5-management
    container_name: rabbitmq
    profiles: ["queue"]
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - queue_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    profiles: ["storage"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - storage_minio_data:/data
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  loki:
    image: grafana/loki:3.7.1
    container_name: loki
    profiles: ["monitoring"]
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - monitoring_loki_data:/loki
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  alloy:
    image: grafana/alloy:v1.15.1
    container_name: alloy
    profiles: ["monitoring"]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  grafana:
    image: grafana/grafana:12.4.0
    container_name: grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - monitoring_grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  nginx:
    image: nginx:1.28.0
    container_name: nginx
    profiles: ["gateway"]
    ports:
      - "8010:8010"
      - "8020:8020"
      - "8030:8030"
      - "8040:8040"
    volumes:
      - ./gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

volumes:
  database_mysql_data:
    external: true
  database_postgres_data:
    external: true
  database_mongo_data:
    external: true
  database_mongo_config:
    external: true
  database_redis_data:
    external: true
  queue_rabbitmq_data:
    external: true
  storage_minio_data:
    external: true
  monitoring_grafana_data:
    external: true
  monitoring_loki_data:
    external: true

networks:
  app-network:
    external: true
